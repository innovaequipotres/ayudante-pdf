name: Frontend CI

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

defaults:
  run:
    working-directory: ./frontend

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Detectar cambios en Frontend
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'contracts/**'
              - '.github/workflows/frontend-ci.yml'

      - name: Configurar Node.js 20
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias limpias
        if: steps.filter.outputs.frontend == 'true'
        run: npm ci

      - name: Análisis estático de código (ESLint)
        if: steps.filter.outputs.frontend == 'true'
        run: npm run lint

      - name: Comprobación estricta de tipos (TypeScript)
        if: steps.filter.outputs.frontend == 'true'
        run: npm run typecheck

      - name: Compilación de prueba (Next.js Build)
        if: steps.filter.outputs.frontend == 'true'
        env:
          NEXT_PUBLIC_ENVIRONMENT: development
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
        run: npm run build

      - name: Omitido (sin cambios en frontend)
        if: steps.filter.outputs.frontend != 'true'
        run: echo "No hubo cambios en frontend. Check completado con éxito."
        
