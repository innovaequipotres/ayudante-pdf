name: Backend CI

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

jobs:
  validate-backend:
    name: validate-backend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Detectar cambios en Backend
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'contracts/**'
              - '.github/workflows/backend-ci.yml'

      - name: Configurar Python
        if: steps.filter.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar sintaxis y dependencias si existen
        if: steps.filter.outputs.backend == 'true'
        run: |
          python -m pip install --upgrade pip flake8
          if [ -d "backend" ] && [ -f "backend/requirements.txt" ]; then
            pip install -r backend/requirements.txt
          fi
          if [ -d "backend" ]; then
            flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
          fi

      - name: Omitido (sin cambios en backend)
        if: steps.filter.outputs.backend != 'true'
        run: echo "No hubo cambios en backend. Check completado con éxito."
        
