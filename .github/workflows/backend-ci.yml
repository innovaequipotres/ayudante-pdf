name: Backend CI

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

defaults:
  run:
    working-directory: ./backend

jobs:
  validate-backend:
    name: validate-backend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Detectar cambios en Backend
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'contracts/**'
              - '.github/workflows/backend-ci.yml'

      - name: Configurar Python
        if: steps.filter.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Instalar dependencias
        if: steps.filter.outputs.backend == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verificar sintaxis y estilo
        if: steps.filter.outputs.backend == 'true'
        run: |
          pip install flake8
          # Detiene la ejecución si hay errores de sintaxis Python o nombres no definidos
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Omitido (sin cambios en backend)
        if: steps.filter.outputs.backend != 'true'
        run: echo "No hubo cambios en backend. Check completado con éxito."
